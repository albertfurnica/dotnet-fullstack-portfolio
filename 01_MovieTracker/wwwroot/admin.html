<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Dashboard - Movie Tracker</title>
        <link rel="stylesheet" href="Styles/admin.css">
    </head>
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle">Add Item</h2>
            <form id="addForm">
                <div id="modalBody">

                </div>
                <button type="submit" class="btn-save">Save</button>
            </form>
        </div>
    </div>
    <body>
        <div class="dashboard-layout">
            <header class="admin-header">
            <img src="Photos/home_logo.jfif" alt="MovieTracker" class="header-logo">
            <button id="btnLogout">LOG OUT</button>
            </header>
            <aside class="admin-leftbar">
                <button id="btnUsers">See users</button>
                <button id="btnMovies">See movies</button>
            </aside>
            <main class="admin-content">
                <div class="list-section">
                    <h2 style="text-align: center;" id="listTitle">Select a database</h2>
                    <button id="btnAdd" class="btn-add" style="display: none;"></button>
                    <ul id="dataList">
                    
                    </ul>
                </div>
            </main>
        </div>
    <script src="Scripts/admin.js"></script>
    </body>
</html>
