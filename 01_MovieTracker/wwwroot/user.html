<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MovieTracker - My Films</title>
        <link rel="stylesheet" href="Styles/user.css">
    </head>
    <body>
        <header class="user-header">
            <img src="Photos/home_logo.jfif" alt="MovieTracker" class="header-logo">
            <div class="user-controls">
                <H2>Welcome, <span id="userNameDisplay"></span>!</H2>
                <a href="user_info.html" style="display: block">YOUR ACCOUNT</a>
                <button id="btnLogout">LOG OUT</button>
            </div>
        </header>

        <main class="user-main">
            <div class="view-filters">
                <button class="filter-btn active" id="btnWatchlist">Watchlist(To Watch)</button>
                <button class="filter-btn" id="btnWatched">Films Logged (Watched)</button>
            </div>
            <section class="movies-grid" id="moviesGrid">
                
            </section>
        </main>
    <script src="Scripts/user.js"></script>
    </body>
</html>
