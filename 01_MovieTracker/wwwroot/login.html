<!DOCTYPE html>
<html lang="end">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <Title>MovieTracker - Login</Title>
        <link rel="stylesheet" href="Styles/login.css">
    </head>
    <body>
        <div class="login-header">
            <a href="home.html">
                <img src="Photos/home_logo.jfif" alt="MovieTracker" class="header-logo">
            </a>
        </div>
        <form id="loginForm" class="form-section">
            <h2>Introduce your credentials:</h2>

            <div class="input-group">
                <label>Introduce your email:</label>
                <input type="email" id="loginEmail" required>
            </div>

            <div class="input-group">
                <label>Introduce your password:</label>
                <input type="password" id="loginPassword" required>
                <div  class="reset-password-container">
                    <a href="resetPassword.html" target="_blank">Forgot your password?</a>
                </div>
            </div>

            <button type="submit" class="login-btn">Login</button>
            <div class="register-section">
                <p>No account? <a href="register.html">Register!</a></p>
            </div>
        </form>
    <script src="Scripts/login.js"></script>
    </body>
</html>
